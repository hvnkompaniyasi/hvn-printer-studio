<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVN Studio – Pro Printer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 520px;
        }

        .container {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px 25px;
            box-shadow: 0 0 30px rgba(255,255,255,0.03);
        }

        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 4px;
            color: #fff;
            font-size: 28px;
        }
        h1 small {
            display: block;
            font-size: 0.5em;
            color: #aaa;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #ddd;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            font-size: 1em;
            min-height: 110px;
            transition: border 0.2s;
            white-space: pre-wrap;
        }
        textarea:focus {
            outline: none;
            border-color: #777;
        }

        .row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .row .form-group {
            flex: 1;
            min-width: 120px;
            margin-bottom: 0;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 1em;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #777;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .btn-group .btn {
            flex: 1;
            min-width: 80px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-primary:hover {
            background: #ddd;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-secondary:hover {
            background: #3a3a3a;
        }

        .btn-style {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
        }
        .btn-style:hover {
            background: #2a2a2a;
            color: #fff;
        }
        .btn-style.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .size-indicator {
            margin-top: 14px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            text-align: center;
            color: #ddd;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            font-size: 0.75em;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<main>
    <div class="container">
        <h1>HVN Studio <small>PRO PRINTER</small></h1>

        <div class="form-group">
            <label for="textInput">📝 Matn</label>
            <textarea id="textInput" placeholder="Chop etiladigan matnni kiriting..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="fontSize">🔤 Shrift (px)</label>
                <input type="number" id="fontSize" value="22" min="8" max="72" step="1">
            </div>
            <div class="form-group">
                <label for="paperSize">📄 Qog‘oz</label>
                <select id="paperSize">
                    <option value="80x210">80 × 210 mm</option>
                    <option value="80x297" selected>80 × 297 mm</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
            <label>🎨 Uslub</label>
            <div class="btn-group">
                <button id="boldToggle" class="btn btn-style">Qalin</button>
                <button id="italicToggle" class="btn btn-style">Kursiv</button>
                <button id="underlineToggle" class="btn btn-style">Tag chizish</button>
            </div>
        </div>

        <div class="btn-group" style="margin-top: 24px;">
            <button id="printBtn" class="btn btn-primary">🖨️ CHOP ETISH</button>
            <button id="saveBtn" class="btn btn-secondary">💾 SAHIFANI SAQLASH</button>
        </div>

        <div class="size-indicator" id="sizeIndicator">80 × 297 mm</div>
        <div class="footer">XPrinter 80×210 / 80×297 uchun optimallashtirilgan</div>
    </div>
</main>

<!-- Yashirin iframe (chop etish uchun) -->
<iframe id="printFrame" title="Chop etish oynasi" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;border:none;"></iframe>

<script>
(function() {
    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSize');
    const paperSizeSelect = document.getElementById('paperSize');
    const boldToggle = document.getElementById('boldToggle');
    const italicToggle = document.getElementById('italicToggle');
    const underlineToggle = document.getElementById('underlineToggle');
    const printBtn = document.getElementById('printBtn');
    const saveBtn = document.getElementById('saveBtn');
    const sizeIndicator = document.getElementById('sizeIndicator');
    const printFrame = document.getElementById('printFrame');

    let isBold = false, isItalic = false, isUnderline = false;
    let isPrinting = false;

    function updateIndicator() {
        sizeIndicator.textContent = paperSizeSelect.options[paperSizeSelect.selectedIndex].text;
    }
    paperSizeSelect.addEventListener('change', updateIndicator);
    updateIndicator();

    function toggleStyle(btn, getState, setState, labelOn, labelOff) {
        return function() {
            const newState = !getState();
            setState(newState);
            btn.classList.toggle('active', newState);
            btn.textContent = newState ? labelOn : labelOff;
        };
    }

    boldToggle.addEventListener('click', toggleStyle(boldToggle, () => isBold, v => isBold = v, 'Qalin (yoqilgan)', 'Qalin'));
    italicToggle.addEventListener('click', toggleStyle(italicToggle, () => isItalic, v => isItalic = v, 'Kursiv (yoqilgan)', 'Kursiv'));
    underlineToggle.addEventListener('click', toggleStyle(underlineToggle, () => isUnderline, v => isUnderline = v, 'Tag chizish (yoqilgan)', 'Tag chizish'));

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function buildPrintHTML() {
        let raw = textInput.value;
        const lines = raw.split('\n');
        const processed = lines.map(line => line.replace(/\s+/g, ' ').trim());
        let finalText = processed.join('\n');
        if (!finalText.trim()) finalText = 'Matn kiriting';
        finalText = escapeHtml(finalText);

        const fontSize = parseInt(fontSizeInput.value, 10) || 22;
        const paperSize = paperSizeSelect.value;
        const [width, height] = paperSize.split('x').map(Number);

        let contentStyle = `
            font-size: ${fontSize}px;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            width: 100%;
            text-align: center;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-sizing: border-box;
        `;
        if (isBold) contentStyle += ' font-weight: bold;';
        if (isItalic) contentStyle += ' font-style: italic;';
        if (isUnderline) contentStyle += ' text-decoration: underline;';

        return `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Chop etish</title>
                <style>
                    @page { size: ${width}mm ${height}mm; margin: 0; }
                    html, body {
                        margin: 0;
                        padding: 0;
                        background: #fff;
                        width: ${width}mm;
                        height: ${height}mm;
                        overflow: hidden;
                    }
                    .content {
                        ${contentStyle}
                        padding: 2mm 3mm 0 3mm;
                    }
                </style>
            </head>
            <body>
                <div class="content">${finalText}</div>
            </body>
            </html>
        `;
    }

    function printViaIframe() {
        if (isPrinting) return;
        isPrinting = true;

        const html = buildPrintHTML();
        const frame = printFrame;

        frame.onload = function() {
            frame.onload = null;
            try {
                frame.contentWindow.focus();
                frame.contentWindow.print();
            } catch (e) {
                console.error('Chop etishda xatolik:', e);
            }
            setTimeout(() => { isPrinting = false; }, 2000);
        };

        frame.srcdoc = html;
    }

    function printDocument() {
        printViaIframe();
    }

    function saveDocument() {
        printViaIframe();
    }

    printBtn.addEventListener('click', printDocument);
    saveBtn.addEventListener('click', saveDocument);

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            printDocument();
        }
    });
})();
</script>

</body>
</html>
